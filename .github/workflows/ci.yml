name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: screenshots
          path: e2e/screenshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-results
          path: test-results/

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run perf

  docker:
    runs-on: ubuntu-latest
    env:
      URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: docker build -t wpasuj .
      - run: sudo install -d -o root -g root -m 755 "$RUNNER_TEMP/data"
      - run: docker run -d --name wpasuj -p 3000:3000 -v "$RUNNER_TEMP/data:/data" -e SITE_URL=$URL wpasuj
      - run: curl --retry 20 --retry-delay 1 --retry-all-errors --fail --silent --output /dev/null $URL
      - name: serves a stylesheet
        run: |
          stylesheet=$(curl --fail --silent $URL | grep --only-matching '/_next/static/[^"]*\.css' | sed -n 1p)
          curl --fail --silent --output /dev/null --write-out '%{content_type}' "$URL$stylesheet" | grep '^text/css'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/answer-poll.spec.ts -g "answers with a name and one drag" --project=desktop-chromium --retries=0
        env:
          E2E_BASE_URL: ${{ env.URL }}
      - run: docker restart wpasuj
      - run: curl --retry 20 --retry-delay 1 --retry-all-errors --fail --silent $URL/api/health
      - name: reads the answered poll back after the restart
        run: |
          poll=$(docker exec wpasuj node -e 'console.log(require("better-sqlite3")(process.env.DATABASE_PATH).prepare("select id from polls").pluck().get())')
          curl --fail --silent $URL/api/polls/$poll | jq --exit-status '[.respondents[] | select(.name == "Zuza" and (.slots | length) == 9)] | length == 1'
      - if: ${{ failure() }}
        run: docker logs wpasuj
