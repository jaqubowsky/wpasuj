name: CI

on:
  pull_request:
    paths-ignore: ["**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - run: docker run --rm -e GH_TOKEN -v "$PWD:/repo:ro" -w /repo ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 --no-progress .
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit signatures
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: tar -cf build.tar .next/standalone
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: build.tar
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: phone-chromium
            browser: chromium
          - project: phone-webkit
            browser: webkit
          - project: desktop-chromium
            browser: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
      - run: tar -xf build.tar
      - run: |
          .github/scripts/memory-monitor.sh memory.log &
          trap 'kill $!' EXIT
          npm run e2e -- --project=${{ matrix.project }}
      - if: ${{ always() }}
        run: sudo dmesg -T | grep -iE 'oom|killed process' || echo 'no oom-kill in dmesg'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: memory-${{ matrix.project }}
          path: memory.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: screenshots-${{ matrix.project }}
          path: e2e/screenshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/

  perf:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
      - run: tar -xf build.tar
      - run: npm run perf

  docker:
    runs-on: ubuntu-latest
    env:
      URL: http://localhost:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: docker build -t wpasuj .
      - run: sudo install -d -o root -g root -m 755 "$RUNNER_TEMP/data"
      - run: docker run -d --name wpasuj -p 3000:3000 -v "$RUNNER_TEMP/data:/data" -e SITE_URL="$URL" wpasuj
      - run: curl --retry 20 --retry-delay 1 --retry-all-errors --fail --silent --output /dev/null "$URL"
      - name: serves a stylesheet
        run: |
          stylesheet=$(curl --fail --silent "$URL" | grep --only-matching '/_next/static/[^"]*\.css' | sed -n 1p)
          curl --fail --silent --output /dev/null --write-out '%{content_type}' "$URL$stylesheet" | grep '^text/css'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/answer-poll.spec.ts -g "answers with a name and one drag" --project=desktop-chromium --retries=0
        env:
          E2E_BASE_URL: ${{ env.URL }}
      - run: docker restart wpasuj
      - run: curl --retry 20 --retry-delay 1 --retry-all-errors --fail --silent "$URL/api/health"
      - name: reads the answered poll back after the restart
        run: |
          poll=$(docker exec wpasuj node -e 'console.log(require("better-sqlite3")(process.env.DATABASE_PATH).prepare("select id from polls").pluck().get())')
          curl --fail --silent "$URL/api/polls/$poll" | jq --exit-status '[.respondents[] | select(.name == "Zuza" and (.slots | length) == 9)] | length == 1'
      - name: serves the poll page on SITE_URL and its card with the fonts in the image
        run: |
          poll=$(docker exec wpasuj node -e 'console.log(require("better-sqlite3")(process.env.DATABASE_PATH).prepare("select id from polls").pluck().get())')
          card=$(curl --fail --silent "$URL/e/$poll" | grep --only-matching "property=\"og:image\" content=\"$URL/e/$poll/opengraph-image/[^\"]*" | cut --delimiter '"' --fields 4)
          curl --fail --silent --output card.png --write-out '%{content_type}' "$card" | grep '^image/png'
          test "$(stat --format %s card.png)" -gt 10000
      - if: ${{ failure() }}
        run: docker logs wpasuj
