name: CI

on:
  pull_request:
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
    paths-ignore: ['**/*.md']

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: tar -cf build.tar .next/standalone
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: build.tar
          retention-days: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: phone-chromium
            browser: chromium
          - project: phone-webkit
            browser: webkit
          - project: desktop-chromium
            browser: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v8
        with:
          name: build
      - run: tar -xf build.tar
      - run: |
          .github/scripts/memory-monitor.sh memory.log &
          trap 'kill $!' EXIT
          npm run e2e -- --project=${{ matrix.project }}
      - if: ${{ always() }}
        run: sudo dmesg -T | grep -iE 'oom|killed process' || echo 'no oom-kill in dmesg'
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: memory-${{ matrix.project }}
          path: memory.log
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: screenshots-${{ matrix.project }}
          path: e2e/screenshots/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/

  perf:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: build
      - run: tar -xf build.tar
      - run: npm run perf

  docker:
    runs-on: ubuntu-latest
    env:
      URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: docker build -t wpasuj .
      - run: sudo install -d -o root -g root -m 755 "$RUNNER_TEMP/data"
      - run: docker run -d --name wpasuj -p 3000:3000 -v "$RUNNER_TEMP/data:/data" -e SITE_URL=$URL wpasuj
      - run: curl --retry 20 --retry-delay 1 --retry-all-errors --fail --silent --output /dev/null $URL
      - name: serves a stylesheet
        run: |
          stylesheet=$(curl --fail --silent $URL | grep --only-matching '/_next/static/[^"]*\.css' | sed -n 1p)
          curl --fail --silent --output /dev/null --write-out '%{content_type}' "$URL$stylesheet" | grep '^text/css'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/answer-poll.spec.ts -g "answers with a name and one drag" --project=desktop-chromium --retries=0
        env:
          E2E_BASE_URL: ${{ env.URL }}
      - run: docker restart wpasuj
      - run: curl --retry 20 --retry-delay 1 --retry-all-errors --fail --silent $URL/api/health
      - name: reads the answered poll back after the restart
        run: |
          poll=$(docker exec wpasuj node -e 'console.log(require("better-sqlite3")(process.env.DATABASE_PATH).prepare("select id from polls").pluck().get())')
          curl --fail --silent $URL/api/polls/$poll | jq --exit-status '[.respondents[] | select(.name == "Zuza" and (.slots | length) == 9)] | length == 1'
      - name: serves the poll page on SITE_URL and its card with the fonts in the image
        run: |
          poll=$(docker exec wpasuj node -e 'console.log(require("better-sqlite3")(process.env.DATABASE_PATH).prepare("select id from polls").pluck().get())')
          curl --fail --silent $URL/e/$poll | grep --quiet "content=\"$URL/e/$poll/opengraph-image"
          curl --fail --silent --output card.png --write-out '%{content_type}' $URL/e/$poll/opengraph-image | grep '^image/png'
          test $(stat --format %s card.png) -gt 10000
      - if: ${{ failure() }}
        run: docker logs wpasuj
