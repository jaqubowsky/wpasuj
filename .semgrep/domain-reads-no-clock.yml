rules:
  - id: domain-reads-no-clock
    languages: [typescript]
    severity: ERROR
    message: A domain function takes the clock as an argument; read the time in server/ or ui/ and pass it in
    paths:
      include:
        - "/src/modules/*/domain/"
      exclude:
        - "*.test.ts"
    pattern-either:
      - pattern: Date.now()
      - pattern: new Date()
