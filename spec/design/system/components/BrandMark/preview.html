<!-- @dsCard group="Display" height=120 subtitle="Mark and wordmark; tiles shuffled after a click" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>BrandMark</title>
<style>
  .b { display: flex; align-items: center; gap: 10px; font: 800 20px/1 var(--font-display); letter-spacing: -0.03em; color: var(--ink); }
  .m { display: grid; grid-template-columns: repeat(3, 8px); gap: 2px; }
  .m i { height: 8px; border-radius: 2.5px; }
  .m i.w { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--edge); }
</style></head>
<body>
<div class="wp-row" style="gap:40px">
  <div class="b"><span class="m"><i style="background:var(--heat-2)"></i><i style="background:var(--heat-4)"></i><i style="background:var(--heat-1)"></i><i style="background:var(--heat-3)"></i><i class="w"></i><i style="background:var(--heat-5)"></i><i style="background:var(--heat-1)"></i><i style="background:var(--heat-3)"></i><i style="background:var(--heat-2)"></i></span>Wpasuj</div>
  <div class="b"><span class="m"><i style="background:var(--heat-5)"></i><i style="background:var(--heat-1)"></i><i class="w"></i><i style="background:var(--heat-2)"></i><i style="background:var(--heat-3)"></i><i style="background:var(--heat-2)"></i><i style="background:var(--heat-4)"></i><i style="background:var(--heat-1)"></i><i style="background:var(--heat-3)"></i></span>Wpasuj</div>
</div>
</body>
</html>
