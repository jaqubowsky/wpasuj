<!-- @dsCard group="Actions" height=240 subtitle="Primary, secondary, on dark, text, small" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="wp-stack" style="max-width:358px">
  <button class="wp-button" data-variant="primary" data-block type="button">Utwórz i wyślij na grupę</button>
  <div class="wp-row"><button class="wp-button" type="button">Przypomnij</button><button class="wp-button" data-size="small" type="button">Więcej</button><button class="wp-button" data-variant="primary" type="button" disabled style="opacity:.4">Wyłączony</button></div>
  <div style="background:var(--ink);padding:12px;border-radius:var(--radius-card)"><button class="wp-button" data-variant="on-dark" data-block type="button">Ustal ten termin</button></div>
  <button class="wp-button" data-variant="text" type="button">Nie mogę w żadnym terminie</button>
</div>
</body>
</html>
