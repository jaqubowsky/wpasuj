<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<style>
  html, body { margin: 0; padding: 0; background: var(--paper); }
  .cv { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--paper); }
  .cv svg { position: absolute; left: 480px; top: 0; }
  .ink { fill: var(--ink); } .acc { fill: var(--accent); } .h5 { fill: var(--heat-5); } .h3 { fill: var(--heat-3); } .h2 { fill: var(--heat-2); } .h1 { fill: var(--heat-1); } .sf { fill: var(--surface); }
  .tile { rx: 10px; } .card { rx: 20px; }
  .name { position: absolute; left: 48px; bottom: 64px; font: 800 120px/0.92 var(--font-display); letter-spacing: -0.035em; color: var(--ink); margin: 0; }
  .tag { position: absolute; left: 50px; bottom: 36px; font: 500 14px/18px var(--font-sans); color: var(--muted); margin: 0; max-width: 440px; }
</style></head>
<body>
<div class="cv">
  <svg width="480" height="300" viewBox="0 0 480 300" aria-hidden="true">
    <!-- blocks: ink 160x300 slab (radius-card) bleeding off the bottom; accent 120x120; heat-5 and heat-3 tiles 56x48 (size-cell, radius-cell) -->
    <!-- arrangement: one tall ink slab with satellites; a 4x5 run of heat tiles warming toward the slab like a poll filling in -->
    <!-- pattern: tiles from the grid (radius-cell, space-cell-gap 6px), because the product's one shape is the tappable hour cell -->
    <!-- scales: cell 56x48, gap 6, radius-cell 10, radius-card 20 -->
    <rect class="ink card" x="300" y="24" width="160" height="300"/>
    <rect class="acc card" x="330" y="52" width="100" height="100"/>
    <g>
      <rect class="h1 tile" x="0" y="40" width="56" height="48"/><rect class="h2 tile" x="62" y="40" width="56" height="48"/><rect class="h3 tile" x="124" y="40" width="56" height="48"/><rect class="h5 tile" x="186" y="40" width="56" height="48"/>
      <rect class="sf tile" x="0" y="94" width="56" height="48"/><rect class="h2 tile" x="62" y="94" width="56" height="48"/><rect class="h5 tile" x="124" y="94" width="56" height="48"/><rect class="h5 tile" x="186" y="94" width="56" height="48"/>
      <rect class="h1 tile" x="0" y="148" width="56" height="48"/><rect class="h3 tile" x="62" y="148" width="56" height="48"/><rect class="h5 tile" x="124" y="148" width="56" height="48"/><rect class="acc tile" x="186" y="148" width="56" height="48"/>
      <rect class="sf tile" x="0" y="202" width="56" height="48"/><rect class="h1 tile" x="62" y="202" width="56" height="48"/><rect class="h3 tile" x="124" y="202" width="56" height="48"/><rect class="h5 tile" x="186" y="202" width="56" height="48"/>
    </g>
  </svg>
  <p class="name">Wpasuj</p>
  <p class="tag">Wspólny termin dla paczki znajomych, w minutę i bez kont.</p>
</div>
</body>
</html>
