<!-- @dsCard group="Inputs" height=300 subtitle="Asking for the end, then a closed range" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>HourRangePicker</title>
<style>
  .hours { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; max-width: 520px; }
  .hours button { height: 44px; border: 0; border-radius: var(--radius-cell); background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--edge); font: 800 16px/1 var(--font-sans); color: var(--ink); }
  .hours.picking button { box-shadow: inset 0 0 0 1.5px var(--heat-4); }
  .hours button.in { background: var(--heat-2); box-shadow: none; }
  .hours button.end { background: var(--ink); color: var(--paper); box-shadow: 0 5px 0 -1px var(--heat-5); }
  .summary { box-sizing: border-box; max-width: 520px; margin: 12px 0 24px; padding: 12px 16px; border-radius: var(--radius-control); background: var(--heat-1); font: 800 18px/28px var(--font-display); text-align: center; }
  .summary.ask { background: var(--ink); color: var(--paper); text-align: left; }
  .summary.ask span { font: 700 16px/24px var(--font-sans); color: var(--heat-3); }
</style></head>
<body>
<div class="hours picking"><button>6</button><button>7</button><button>8</button><button>9</button><button>10</button><button>11</button><button>12</button><button>13</button><button>14</button><button>15</button><button>16</button><button class="end">17</button><button class="in">18</button><button class="in">19</button><button>20</button><button>21</button></div>
<p class="summary ask">Od 17:00 <span>kliknij ostatnią godzinę →</span></p>
<div class="hours"><button>14</button><button>15</button><button>16</button><button class="end">17</button><button class="in">18</button><button class="in">19</button><button class="in">20</button><button class="in">21</button><button class="end">22</button><button>23</button><button>0</button><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button></div>
<p class="summary">17:00 → 23:00 · 6 godzin</p>
</body>
</html>
