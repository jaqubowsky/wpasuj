<!doctype html>
<html>
<head><meta charset="utf-8"><title>LinkCard</title>
<style>
  .lc { width: 300px; border-radius: var(--radius-card); overflow: hidden; background: var(--surface); box-shadow: 0 26px 50px -24px rgba(30,27,24,.45), 0 0 0 1px rgba(30,27,24,.06); }
  .lc .h { padding: 16px 20px; display: grid; gap: 6px; }
  .lc small { font-size: 12px; }
  .lc b { font: 800 26px/1.1 var(--font-display); }
  .lc .u { padding: 10px 20px; font-size: 14px; color: var(--muted); }
</style></head>
<body>
<div class="wp-row" style="gap:20px;align-items:start">
  <div class="lc"><div class="h" style="background:var(--accent);color:var(--ink)"><small>Kuba pyta, kiedy możesz</small><b>Grill na działce u Oli</b></div><div class="u">wpasuj.pl · jeden link zamiast wszystkiego</div></div>
</div>
</body>
</html>
