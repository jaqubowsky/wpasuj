<!-- @dsCard group="Display" height=360 subtitle="Header button and the list's rows" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>MyPolls</title>
<style>
  body { display: grid; gap: 16px; }
  .button { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 0; background: none; color: var(--ink); font: 600 16px/24px var(--font-sans); }
  .count { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: var(--ink); color: #fff; font: 600 14px/20px var(--font-sans); font-variant-numeric: tabular-nums; }
  .panel { box-sizing: border-box; width: 360px; padding: 20px; border-radius: var(--radius-card); background: var(--surface); display: grid; gap: 8px; }
  .row { display: grid; gap: 4px; padding: 14px 16px; border-radius: var(--radius-control); background: var(--surface); box-shadow: inset 0 0 0 1px var(--edge); }
  .title { font: 700 18px/28px var(--font-display); letter-spacing: -0.01em; }
  .meta { color: var(--muted); font: 500 14px/20px var(--font-sans); font-variant-numeric: tabular-nums; }
  .settled { color: var(--ink); font-weight: 600; }
</style></head>
<body>
<div><button class="button">Moje ankiety <span class="count">2</span></button></div>
<div class="panel">
  <div class="row"><span class="title">Grill u Bartka</span><span class="meta">Odpowiadasz · pt 24.10 – nd 26.10</span><span class="meta settled">Ustalone: sobota 25.10, 19–22</span></div>
  <div class="row"><span class="title">Kino</span><span class="meta">Twoja ankieta · sb 18.10 – nd 19.10</span><span class="meta">6 osób odpowiedziało</span></div>
</div>
</body>
</html>
