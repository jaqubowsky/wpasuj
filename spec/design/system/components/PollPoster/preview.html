<!-- @dsCard group="Display" height=640 subtitle="A friend's coral poster, the organiser's ink one and a settled one" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>PollPoster</title>
<style>
  .pp { padding: 20px 20px 12px; display: grid; gap: 12px; font-family: var(--font-sans); }
  .pp .who { justify-self: start; display: inline-flex; align-items: center; gap: 8px; background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 14px 4px 4px; font: 600 14px/20px var(--font-sans); }
  .pp h1 { margin: 0; font: 800 40px/44px var(--font-display); letter-spacing: -0.03em; }
  .pp .row { display: flex; justify-content: space-between; align-items: end; font: 600 16px/24px var(--font-sans); }
  .pp .st { display: flex; }
  .pp .st span { width: 40px; height: 40px; border-radius: var(--radius-cell); margin-left: -8px; display: grid; place-items: center; color: var(--ink); font: 600 16px/1 var(--font-sans); }
  .pp .st span:first-child { margin-left: 0; }
</style></head>
<body style="padding:0">
<div class="pp" style="background:var(--accent);color:var(--ink)"><span class="who"><span class="wp-avatar" data-tint="sky">K</span>Kuba pyta</span><h1>Grill u Oli na działce</h1><div class="row">5 osób już odpowiedziało<span class="st"><span style="background:var(--tint-sky);box-shadow:0 0 0 3px var(--accent)">A</span><span style="background:var(--tint-butter);box-shadow:0 0 0 3px var(--accent)">B</span><span style="background:var(--tint-coral);box-shadow:0 0 0 3px var(--accent)">Z</span></span></div></div>
<svg viewBox="0 0 1440 28" preserveAspectRatio="none" style="display:block;width:100%;height:28px;fill:var(--accent);transform:rotate(180deg)"><path d="M0 28 L0 14 Q 20 0 40 14 T 80 14 T 120 14 T 160 14 T 200 14 T 240 14 T 280 14 T 320 14 T 360 14 T 400 14 T 440 14 T 480 14 T 520 14 T 560 14 T 600 14 T 640 14 T 680 14 T 720 14 T 760 14 T 800 14 T 840 14 T 880 14 T 920 14 T 960 14 T 1000 14 T 1040 14 T 1080 14 T 1120 14 T 1160 14 T 1200 14 T 1240 14 T 1280 14 T 1320 14 T 1360 14 T 1400 14 T 1440 14 L1440 28 Z"/></svg>
<div class="pp" style="background:var(--ink);color:var(--paper);margin-top:16px"><span class="who"><span class="wp-avatar" data-tint="sky">K</span>Pytasz jako Kuba</span><h1>Grill u Oli na działce</h1><div class="row">5 osób już odpowiedziało<span class="st"><span style="background:var(--tint-sky);box-shadow:0 0 0 3px var(--ink)">A</span><span style="background:var(--tint-butter);box-shadow:0 0 0 3px var(--ink)">B</span><span style="background:var(--tint-coral);box-shadow:0 0 0 3px var(--ink)">Z</span></span></div></div>
<svg viewBox="0 0 1440 28" preserveAspectRatio="none" style="display:block;width:100%;height:28px;fill:var(--ink);transform:rotate(180deg)"><path d="M0 28 L0 14 Q 20 0 40 14 T 80 14 T 120 14 T 160 14 T 200 14 T 240 14 T 280 14 T 320 14 T 360 14 T 400 14 T 440 14 T 480 14 T 520 14 T 560 14 T 600 14 T 640 14 T 680 14 T 720 14 T 760 14 T 800 14 T 840 14 T 880 14 T 920 14 T 960 14 T 1000 14 T 1040 14 T 1080 14 T 1120 14 T 1160 14 T 1200 14 T 1240 14 T 1280 14 T 1320 14 T 1360 14 T 1400 14 T 1440 14 L1440 28 Z"/></svg>

<div class="pp" style="background:var(--accent);color:var(--ink);margin-top:16px"><span class="who"><span class="wp-avatar" data-tint="sky">K</span>Grill u Oli na działce</span><h1 style="font-size:48px;line-height:52px;display:grid"><span>Sobota</span><span>3 października</span><span style="color:var(--paper)">19:00–21:00</span></h1><div class="row" style="align-items:center"><span style="background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 14px;font:800 14px/20px var(--font-sans);transform:rotate(-4deg)">Widzimy się</span>Ustalone przez: Kuba</div></div>

</html>
