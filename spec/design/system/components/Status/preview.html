<!-- @dsCard group="Display" height=96 subtitle="Working, done, done faded, failed" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Status</title></head>
<body>
<div class="wp-stack">
  <span class="wp-status" data-state="saving"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="28 10"/></svg>Zapisuję</span>
  <span class="wp-status" data-state="saved"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Zapisane</span>
  <span class="wp-status" data-state="saved" data-faded><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Zapisane</span>
  <span class="wp-row" style="gap:12px"><span class="wp-status" data-state="failed"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v3.5M8 11h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Nie zapisano</span><button class="wp-button" data-size="small" type="button">Spróbuj ponownie</button></span>
</div>
</body>
</html>
