<!-- @dsCard group="Landing" height=160 subtitle="Tiles mid-flight around a poster" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>TileBurst</title>
<style>.t { position: absolute; width: 14px; height: 14px; border-radius: 4px; }</style></head>
<body>
<div style="position:relative;height:130px">
  <div style="position:absolute;left:110px;top:30px;width:80px;height:60px;border-radius:var(--radius-card);background:var(--accent)"></div>
  <i class="t" style="left:60px;top:20px;background:var(--heat-2);transform:rotate(20deg)"></i>
  <i class="t" style="left:220px;top:10px;background:var(--heat-4);transform:rotate(-30deg)"></i>
  <i class="t" style="left:80px;top:100px;background:var(--heat-5);opacity:.6"></i>
  <i class="t" style="left:210px;top:96px;background:var(--ink);transform:rotate(45deg) scale(.7)"></i>
  <i class="t" style="left:150px;top:4px;background:var(--heat-3);opacity:.8"></i>
</div>
</body>
</html>
