<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wpasuj: Nowa ankieta</title><link rel="stylesheet" href="kiedy.css">
<style>
  body { width: 390px; min-height: 844px; }
  header { height: 56px; display: flex; align-items: center; padding: 0 20px; }
  main { padding: 8px 20px 112px; display: flex; flex-direction: column; gap: 28px; }
  .q { font: 700 15px/20px var(--sans); margin-bottom: 10px; }
  .what { font: 700 30px/36px var(--display); letter-spacing: -0.025em; padding: 14px 0 12px; border-bottom: 2px solid var(--ink); }
  .what .caret { display: inline-block; width: 2px; height: 28px; background: var(--accent); vertical-align: -5px; margin-left: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .week { margin-top: 12px; padding: 12px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .week .wd { text-align: center; font-size: 12px; font-weight: 500; color: var(--muted); padding-bottom: 4px; }
  .week .d { height: 40px; border-radius: 10px; display: grid; place-items: center; font-weight: 500; }
  .week .d.past { color: #C9C1B6; }
  .week .d.sel { background: var(--accent); color: #fff; font-weight: 600; }
  .week .d.today { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .more { margin-top: 10px; font-size: 14px; font-weight: 500; color: var(--muted); text-align: center; }
  .summary { font-size: 14px; color: var(--muted); margin-top: 10px; }
  .summary b { color: var(--ink); font-weight: 600; }
.sticky { position: fixed; left: 0; right: 0; bottom: 0; width: 390px; padding: 12px 20px 28px; background: var(--paper); border-top: 1px solid var(--line); }
</style></head>
<body>
<header><span class="logo">Wpasuj</span></header>
<main>
  <section>
    <div class="q">Co robimy?</div>
    <div class="what">Planszówki u Michała<span class="caret"></span></div>
  </section>
  <section>
    <div class="q">Kiedy?</div>
    <div class="chips"><span class="chip">Dziś</span><span class="chip">Jutro</span><span class="chip on">Ten weekend</span><span class="chip">Przyszły tydzień</span></div>
    <div class="card week" id="wk"></div>
    <div class="more">Pokaż cały miesiąc</div>
    <div class="summary"><b>pt 17, sb 18, nd 19 października</b></div>
  </section>
  <section>
    <div class="q">O której?</div>
    <div class="chips"><span class="chip on">Wieczór 17–23</span><span class="chip">Cały dzień</span><span class="chip">Własne</span></div>
  </section>
  <section>
    <div class="q">Twoje imię</div>
    <div class="card" style="height:56px;display:flex;align-items:center;padding:0 16px;font-size:16px;font-weight:500">Kuba</div>
  </section>
</main>
<div class="sticky"><button class="btn primary block">Utwórz i wyślij na grupę</button></div>
<script>
  const wd = ["pn","wt","śr","cz","pt","sb","nd"];
  const p = wd.map((d) => `<div class="wd">${d}</div>`);
  for (let d = 13; d <= 26; d++) {
    const c = ["d"]; if (d < 16) c.push("past"); if (d === 16) c.push("today"); if (d >= 17 && d <= 19) c.push("sel");
    p.push(`<div class="${c.join(" ")}">${d}</div>`);
  }
  document.getElementById("wk").innerHTML = p.join("");
</script>
</body></html>
