<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Wpasuj: OG</title><link rel="stylesheet" href="kiedy.css">
<style>
  body { width: 1200px; height: 630px; overflow: hidden; }
  .og { height: 100%; padding: 64px 72px; display: grid; grid-template-columns: 1fr 360px; gap: 56px; align-items: center; }
  .k { font: 600 26px/1 var(--sans); color: var(--muted); }
  .t { font: 800 84px/88px var(--display); letter-spacing: -0.035em; margin: 20px 0 28px; }
  .d { font: 500 28px/36px var(--sans); }
  .n { margin-top: 40px; display: inline-flex; align-items: center; gap: 12px; background: var(--ink); color: #fff; border-radius: 999px; padding: 16px 28px; font: 600 26px/1 var(--sans); }
  .n i { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
  .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .mini b { height: 58px; border-radius: 14px; }
  .logo { position: absolute; left: 72px; bottom: 44px; font-size: 30px; }
</style></head>
<body>
<div class="og">
  <div>
    <div class="k">Kuba pyta, kiedy możesz</div>
    <div class="t">Planszówki u&nbsp;Michała</div>
    <div class="d">pt 17 – nd 19 października, wieczorem</div>
    <div class="n"><i></i>Kiedy możesz?</div>
  </div>
  <div class="mini" id="m"></div>
</div>
<span class="logo">Wpasuj</span>
<script src="grid.js"></script>
<script>
  const cells = [];
  HOURS.forEach((_, s) => [0, 1, 2].forEach((d) => {
    cells.push(`<b style="background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)"></b>`);
  }));
  document.getElementById("m").innerHTML = cells.join("");
</script>
</body></html>
